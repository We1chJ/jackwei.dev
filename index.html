<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Gacha</title>
    <meta name="description" content="Jack Wei builds too many things. Crank the machine and get a project.">
    <link rel="icon" href="/mascot.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,500;0,700;0,900;1,700&display=swap">
</head>

<body>
    <!-- "Insert coin" loading screen: static so it paints before any script arrives (src/loader.ts drives it). -->
    <div id="loader" class="loader" role="progressbar" aria-label="Loading the machine" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="door door-l"><div class="door-content"></div></div>
        <div class="door door-r"><div class="door-content"></div></div>
        <div class="loader-body">
            <div class="loader-title">
                <img class="loader-mascot" src="/mascot.jpg" alt="" width="64" height="64">
                <h1>JACK GACHA</h1>
            </div>
            <div class="plate">
                <i class="plate-glint"></i>
                <i class="screw" style="left:10px;top:10px;--a:20deg"></i>
                <i class="screw" style="right:10px;top:10px;--a:115deg"></i>
                <i class="screw" style="left:10px;bottom:10px;--a:70deg"></i>
                <i class="screw" style="right:10px;bottom:10px;--a:160deg"></i>
                <div class="groove">
                    <div class="rail"></div>
                    <div class="coin-fly">
                        <i class="coin-shadow"></i>
                        <button class="coin-hop" type="button" aria-label="Coin">
                            <span class="coin3d">
                                <span class="coin-face front">
                                    <svg viewBox="0 0 100 100" aria-hidden="true">
                                        <defs>
                                            <radialGradient id="coin-gold" cx="50%" cy="50%" r="50%">
                                                <stop offset="0" stop-color="#FFE9A0"/><stop offset=".62" stop-color="#F4C847"/><stop offset=".9" stop-color="#D9A21C"/><stop offset="1" stop-color="#B58210"/>
                                            </radialGradient>
                                            <filter id="coin-emboss" x="-10%" y="-10%" width="120%" height="120%">
                                                <feDropShadow dx="-.7" dy="-.7" stdDeviation=".35" flood-color="#FFF7D0" flood-opacity=".95"/>
                                                <feDropShadow dx=".9" dy=".9" stdDeviation=".45" flood-color="#6E4C00" flood-opacity=".75"/>
                                            </filter>
                                            <path id="coin-ring" d="M50,50 m-34.5,0 a34.5,34.5 0 1,1 69,0 a34.5,34.5 0 1,1 -69,0"/>
                                        </defs>
                                        <circle cx="50" cy="50" r="50" fill="url(#coin-gold)"/>
                                        <circle cx="50" cy="50" r="49.3" fill="none" stroke="#8A6408" stroke-width="1.2"/>
                                        <g filter="url(#coin-emboss)" fill="none" stroke="#C8941A">
                                            <circle cx="50" cy="50" r="45" stroke-width="2.2"/>
                                            <circle cx="50" cy="50" r="41.6" stroke-width="1.9" stroke-dasharray=".01 2.7" stroke-linecap="round" stroke="#E2AF33"/>
                                            <circle cx="50" cy="50" r="26.5" stroke-width="1.4"/>
                                        </g>
                                        <g filter="url(#coin-emboss)">
                                            <text font-family="Lilita One, Arial Black, sans-serif" font-size="8.6" fill="#D19C1E"><textPath href="#coin-ring" textLength="212" lengthAdjust="spacing">JACK GACHA ★ 1 TURN = 1 PROJECT ★</textPath></text>
                                            <g stroke="#9C6F0A" stroke-width="1.3" stroke-linejoin="round">
                                                <path d="M50 38 C50 34 50.6 32 51.6 30" fill="none"/>
                                                <ellipse cx="47.4" cy="30.2" rx="3.7" ry="2" transform="rotate(-25 47.4 30.2)" fill="#F1C64A"/>
                                                <ellipse cx="55.6" cy="28.8" rx="3.7" ry="2" transform="rotate(20 55.6 28.8)" fill="#F1C64A"/>
                                                <ellipse cx="50" cy="52" rx="16" ry="14.5" fill="#F3CB52"/>
                                                <circle cx="44.4" cy="49" r="4.6" fill="#FBE7A6"/>
                                                <circle cx="56" cy="48" r="5.8" fill="#FBE7A6"/>
                                                <ellipse cx="50.5" cy="58.6" rx="4.6" ry="4" fill="#B6830F"/>
                                            </g>
                                            <circle cx="45" cy="49.6" r="1.6" fill="#9C6F0A"/>
                                            <circle cx="57" cy="48.6" r="2" fill="#9C6F0A"/>
                                        </g>
                                    </svg>
                                </span>
                                <span class="coin-face back">
                                    <svg viewBox="0 0 100 100" aria-hidden="true">
                                        <circle cx="50" cy="50" r="50" fill="url(#coin-gold)"/>
                                        <g filter="url(#coin-emboss)" fill="none" stroke="#C8941A"><circle cx="50" cy="50" r="45" stroke-width="2.2"/></g>
                                        <text filter="url(#coin-emboss)" x="50" y="66" text-anchor="middle" font-family="Lilita One, Arial Black, sans-serif" font-size="46" fill="#D19C1E">1</text>
                                    </svg>
                                </span>
                                <span class="coin-edge"></span>
                            </span>
                            <i class="coin-sheen"></i>
                        </button>
                    </div>
                </div>
                <div class="slot-bezel"><span class="slot"></span></div>
                <div class="led"><span class="led-label">LOADING</span><span class="led-num">000%</span></div>
                <span class="engraved">MODEL JW-1 · MADE IN JACK’S ROOM</span>
            </div>
            <p class="loader-status"><span class="loader-line">Warming up the machine…</span></p>
            <button class="loader-retry" type="button" hidden>Give it a kick (reload)</button>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>

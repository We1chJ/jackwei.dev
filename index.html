<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Gacha</title>
    <meta name="description" content="Jack Wei builds too many things. Crank the machine and get a project.">
    <link rel="icon" href="/mascot.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,500;0,700;0,900;1,700&display=swap">
</head>

<body>
    <!-- Loading screen: static so it paints before any script arrives (src/loader.ts drives it).
         The hero drawn in light on black, filling as it loads; put the coin in the slot to enter. -->
    <div id="loader" class="loader" role="progressbar" aria-label="Loading jackwei.dev" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loader-bg"></div>
        <svg class="outline outline-dim" aria-hidden="true"></svg>
        <div class="outline-window" aria-hidden="true"><svg class="outline outline-lit"></svg></div>
        <div class="loader-body">
            <div class="loader-row">
                <div class="loader-track"><i class="loader-fill"></i><i class="loader-glow"></i></div>
                <div class="coin" aria-hidden="true"></div>
                <i class="loader-slot"></i>
            </div>
            <p class="loader-caption" aria-live="polite"><span class="cap-text">Loading the arcade</span><span class="cap-num"></span></p>
            <button class="loader-retry" type="button" hidden>Couldn’t load. Reload</button>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
